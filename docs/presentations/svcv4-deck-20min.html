<title>SVCv4 Data Model — Presentation</title>
<style>
  :root{
    --paper:#eef1f5; --surface:#ffffff; --ink:#0e1620; --body:#33414f;
    --muted:#697787; --hair:#d7dde5; --hair-2:#e7ebf0;
    --accent:#0c868c; --accent-soft:#0c868c1a; --amber:#b3701f; --amber-soft:#b3701f18;
    --b-benign:#3f6fa3; --b-mid:#8a93a1; --b-path:#bb6733;
    --sans:-apple-system,system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono","Cascadia Code","JetBrains Mono",Menlo,Consolas,monospace;
    --shadow:0 1px 0 #ffffff, 0 18px 44px -24px #0e162033;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --paper:#0a1017; --surface:#111a24; --ink:#eef3f8; --body:#b8c4d0;
      --muted:#7d8b9b; --hair:#22303d; --hair-2:#1a2632;
      --accent:#2bbcc2; --accent-soft:#2bbcc21f; --amber:#d99a44; --amber-soft:#d99a4420;
      --b-benign:#5487bd; --b-mid:#8a93a1; --b-path:#cf7c44;
      --shadow:0 0 0 1px #ffffff08, 0 26px 60px -30px #000000cc;
    }
  }
  :root[data-theme="light"]{
    --paper:#eef1f5; --surface:#ffffff; --ink:#0e1620; --body:#33414f; --muted:#697787;
    --hair:#d7dde5; --hair-2:#e7ebf0; --accent:#0c868c; --accent-soft:#0c868c1a;
    --amber:#b3701f; --amber-soft:#b3701f18; --b-benign:#3f6fa3; --b-mid:#8a93a1; --b-path:#bb6733;
    --shadow:0 1px 0 #ffffff, 0 18px 44px -24px #0e162033;
  }
  :root[data-theme="dark"]{
    --paper:#0a1017; --surface:#111a24; --ink:#eef3f8; --body:#b8c4d0; --muted:#7d8b9b;
    --hair:#22303d; --hair-2:#1a2632; --accent:#2bbcc2; --accent-soft:#2bbcc21f;
    --amber:#d99a44; --amber-soft:#d99a4420; --b-benign:#5487bd; --b-mid:#8a93a1; --b-path:#cf7c44;
    --shadow:0 0 0 1px #ffffff08, 0 26px 60px -30px #000000cc;
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:
      radial-gradient(120% 120% at 100% 0%, var(--accent-soft), transparent 42%),
      var(--paper);
    color:var(--body); font-family:var(--sans);
    -webkit-font-smoothing:antialiased; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
  }

  #stage{
    position:relative; width:min(97vw, calc(97dvh * 16 / 9)); aspect-ratio:16/9;
    background:var(--surface); color:var(--body);
    border:1px solid var(--hair); border-radius:14px; box-shadow:var(--shadow);
    container-type:size; overflow:hidden;
  }

  .slide{position:absolute; inset:0; padding:7.4cqh 8cqw 8.4cqh; display:flex; flex-direction:column;}
  @media (prefers-reduced-motion:no-preference){
    .slide{animation:rise .42s cubic-bezier(.2,.7,.2,1) both}
    @keyframes rise{from{opacity:0; transform:translateY(1.4cqh)} to{opacity:1; transform:none}}
  }

  .kicker{
    font-family:var(--mono); font-size:1.85cqh; letter-spacing:.22em; text-transform:uppercase;
    color:var(--accent); font-weight:600; display:flex; align-items:center; gap:1.1cqw;
  }
  .kicker::before{content:""; width:2.6cqw; height:1px; background:var(--accent); opacity:.7}
  h1.title{
    font-family:var(--sans); color:var(--ink); font-weight:780; letter-spacing:-.015em;
    line-height:1.04; text-wrap:balance; margin:2.2cqh 0 0; font-size:5.9cqh; max-width:24ch;
  }
  .slide .content{margin-top:0; padding-top:3.4cqh}

  ul.points{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:2.05cqh}
  ul.points li{position:relative; padding-left:3.4cqw; font-size:2.72cqh; line-height:1.34; color:var(--body); max-width:52ch}
  ul.points li::before{
    content:""; position:absolute; left:0; top:.62em; width:1.4cqw; height:1.4cqw; min-width:9px; min-height:9px;
    border-radius:2px; background:var(--accent); transform:rotate(45deg);
  }
  ul.points.amber li::before{background:var(--amber)}
  strong{color:var(--ink); font-weight:680}
  em{font-style:italic; color:var(--body)}
  .lead{font-size:3.05cqh; line-height:1.32; color:var(--body); max-width:46ch; margin:0}
  code,.code{font-family:var(--mono); font-size:.9em; background:var(--accent-soft); color:var(--ink);
    padding:.12em .42em; border-radius:5px; border:1px solid var(--hair); white-space:nowrap}

  /* three-groups table */
  table.kv{border-collapse:separate; border-spacing:0; width:100%; font-size:2.34cqh}
  table.kv td{padding:1.9cqh 1.8cqw; border-top:1px solid var(--hair); vertical-align:top}
  table.kv tr:first-child td{border-top:none}
  table.kv .who{color:var(--ink); font-weight:680; width:31%}
  table.kv .own{color:var(--accent); font-family:var(--mono); font-size:.8em; letter-spacing:.04em;
    text-transform:uppercase; width:20%; padding-top:2.2cqh}
  table.kv .what{color:var(--body)}
  .mine td{background:var(--accent-soft)}

  /* numbered steps */
  ol.steps{list-style:none; counter-reset:s; margin:0; padding:0; display:flex; flex-direction:column; gap:1.9cqh}
  ol.steps li{counter-increment:s; position:relative; padding-left:6cqw; font-size:2.66cqh; line-height:1.3; color:var(--body); max-width:54ch}
  ol.steps li::before{
    content:counter(s,decimal-leading-zero); position:absolute; left:0; top:-.1em;
    font-family:var(--mono); font-size:2.1cqh; font-weight:600; color:var(--accent);
    border:1px solid var(--accent); border-radius:6px; padding:.28em .5em; line-height:1;
  }

  /* nesting motif */
  .nest{display:flex; flex-direction:column; gap:0; margin-top:1cqh}
  .nb{border:1px solid var(--hair); border-left:3px solid var(--accent); border-radius:10px;
    padding:1.7cqh 2cqw; margin-left:0; background:var(--surface)}
  .nb .nl{font-family:var(--mono); font-size:1.7cqh; letter-spacing:.12em; text-transform:uppercase; color:var(--accent)}
  .nb .nt{font-size:2.4cqh; color:var(--ink); font-weight:640; margin-top:.4cqh}
  .nb.n2{margin:1.2cqh 0 0 5cqw; border-left-color:var(--amber)}
  .nb.n2 .nl{color:var(--amber)}
  .nb.n3{margin:1.2cqh 0 0 10cqw; border-left-color:var(--b-mid)}
  .nb.n3 .nl{color:var(--muted)}

  /* two-col grid (entities / dials) */
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:2.3cqh 3.2cqw}
  .cell{border-top:2px solid var(--hair); padding-top:1.5cqh}
  .cell .ct{font-family:var(--mono); font-size:1.8cqh; letter-spacing:.08em; text-transform:uppercase; color:var(--accent); font-weight:600}
  .cell .cd{font-size:2.4cqh; line-height:1.3; color:var(--body); margin-top:.7cqh; max-width:34ch}
  .cell .cd b{color:var(--ink)}
  .cell.amber .ct{color:var(--amber)}

  /* split (coarse vs granular) */
  .split{display:grid; grid-template-columns:1fr 1fr; gap:3.2cqw; margin-top:.6cqh}
  .col{border:1px solid var(--hair); border-radius:12px; padding:2.2cqh 2cqw; background:var(--surface)}
  .col.good{border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent-soft)}
  .col .h{font-family:var(--mono); font-size:1.85cqh; letter-spacing:.1em; text-transform:uppercase; margin-bottom:1.1cqh}
  .col.bad .h{color:var(--muted)} .col.good .h{color:var(--accent)}
  .col p{margin:0; font-size:2.32cqh; line-height:1.32; color:var(--body)}

  /* takeaways */
  ol.take{list-style:none; counter-reset:t; margin:0; padding:0; display:grid; grid-template-columns:1fr 1fr; gap:2cqh 3.2cqw}
  ol.take li{counter-increment:t; position:relative; padding-left:4.4cqw; font-size:2.3cqh; line-height:1.28; color:var(--body)}
  ol.take li::before{content:counter(t); position:absolute; left:0; top:-.05em; font-family:var(--mono);
    font-weight:700; font-size:2.2cqh; color:var(--accent)}
  .capstone{margin-top:2.4cqh; padding-top:2cqh; border-top:1px solid var(--hair);
    font-size:2.34cqh; line-height:1.34; color:var(--ink); font-weight:560; max-width:64ch}

  /* hero */
  .hero{height:100%; display:flex; flex-direction:column; justify-content:center}
  .hero h1{font-size:7.1cqh; max-width:20ch; margin:2.4cqh 0 0}
  .hero .sub{font-size:2.86cqh; line-height:1.36; color:var(--body); max-width:44ch; margin:3cqh 0 0}
  .hero .by{margin-top:auto; font-family:var(--mono); font-size:1.9cqh; color:var(--muted); letter-spacing:.03em}
  .hero .by b{color:var(--ink); font-weight:600}

  .spectrum{display:flex; height:1.15cqh; border-radius:99px; overflow:hidden; width:min(52cqw,100%); margin-top:3.4cqh}
  .spectrum i{flex:1}
  .spectrum .s1{background:var(--b-benign)} .spectrum .s2{background:var(--b-mid)} .spectrum .s3{background:var(--b-path)}
  .spectrum-lab{display:flex; justify-content:space-between; width:min(52cqw,100%); margin-top:1cqh;
    font-family:var(--mono); font-size:1.55cqh; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}

  .closing{height:100%; display:flex; flex-direction:column; justify-content:center}
  .closing .credits{margin-top:3cqh; font-size:2.2cqh; line-height:1.5; color:var(--body); max-width:52ch}
  .closing .credits b{color:var(--ink)} .closing .links{margin-top:auto; font-family:var(--mono); font-size:1.85cqh; color:var(--accent)}

  /* --- v2 visual components (codes · trees · MIS_PRD demo) --- */
  .slide .content.top{margin-top:0; padding-top:2.2cqh}
  .tiers{display:flex; align-items:center; gap:1cqw; margin-top:2cqh}
  .tarrow{color:var(--muted); font-size:2.8cqh}
  .tier{flex:1; border:1px solid var(--hair); border-radius:10px; padding:1.8cqh 1.4cqw; background:var(--surface)}
  .tier .tl{font-family:var(--mono); font-size:1.5cqh; letter-spacing:.12em; text-transform:uppercase; color:var(--muted)}
  .tier .tn{font-size:2.7cqh; color:var(--ink); font-weight:720; margin-top:.6cqh}
  .tier .te{font-family:var(--mono); font-size:1.55cqh; color:var(--accent); margin-top:.7cqh}
  .tier .cc{font-family:var(--mono); color:var(--accent)}
  .tree{font-family:var(--mono); font-size:2.0cqh; line-height:1.6; color:var(--body); margin-top:1.4cqh; white-space:pre; overflow-x:auto}
  .tree.small{font-size:1.78cqh; line-height:1.5; margin-top:0}
  .tree .lvl0{color:var(--ink); font-weight:700}
  .tree .code{color:var(--accent); background:none; border:none; padding:0}
  .tree .held{color:var(--amber); font-weight:600}
  .tag{font-family:var(--mono); font-size:1.35cqh; letter-spacing:.05em; text-transform:uppercase; padding:.12em .5em; border-radius:4px}
  .tag.need{background:var(--amber-soft); color:var(--amber); border:1px dashed var(--amber)}
  .tag.sub{background:var(--accent-soft); color:var(--accent); border:1px dashed var(--accent)}
  .tag.off{color:var(--muted); border:1px solid var(--hair)}
  .maptwo{display:grid; grid-template-columns:1fr auto 1fr; gap:1.3cqw; align-items:center; margin-top:1.6cqh}
  .mapcol{border:1px solid var(--hair); border-radius:10px; padding:1.5cqh 1.2cqw; background:var(--surface)}
  .mapcol h4{font-family:var(--mono); font-size:1.5cqh; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin:0 0 1cqh; font-weight:600}
  .mapmid{color:var(--accent); font-size:3cqh; text-align:center}
  .demo{display:grid; grid-template-columns:1.08fr 1fr; gap:2.1cqw; margin-top:1.6cqh; align-items:start}
  .demo img{width:100%; border:1px solid var(--hair); border-radius:8px; background:#fff; display:block}
  .demo .cap{font-family:var(--mono); font-size:1.4cqh; color:var(--muted); margin-top:.8cqh; letter-spacing:.03em}
  .leaf{border:1px solid var(--hair); border-left:3px solid var(--accent); border-radius:8px; padding:1.1cqh 1.3cqw; margin-bottom:1.1cqh; background:var(--surface)}
  .leaf.amber{border-left-color:var(--amber)}
  .leaf .lh{font-family:var(--mono); font-size:1.5cqh; letter-spacing:.06em; color:var(--accent); text-transform:uppercase}
  .leaf.amber .lh{color:var(--amber)}
  .leaf .lb{font-size:1.9cqh; color:var(--ink); margin-top:.3cqh}
  .chip{display:inline-block; font-family:var(--mono); font-size:1.48cqh; background:var(--accent-soft); border:1px solid var(--hair); border-radius:5px; padding:.2em .55em; margin:.7cqh .4cqw 0 0; color:var(--body)}
  .chip b{color:var(--ink)}
  .result{border:1px solid var(--accent); background:var(--accent-soft); border-radius:8px; padding:1.2cqh 1.3cqw; font-size:1.95cqh; color:var(--ink); margin-top:.3cqh}
  .tag.prov{background:var(--amber-soft); color:var(--amber); border:1px dashed var(--amber)}
  /* summary-table excerpt */
  .stbl{width:100%; border:1px solid var(--hair); border-radius:8px; border-collapse:separate; border-spacing:0; overflow:hidden; font-size:1.55cqh}
  .stbl caption{caption-side:top; text-align:left; font-family:var(--mono); font-size:1.4cqh; letter-spacing:.04em; color:var(--muted); padding:0 0 .8cqh; text-transform:uppercase}
  .stbl th{background:var(--accent-soft); font-family:var(--mono); font-size:1.2cqh; letter-spacing:.05em; text-transform:uppercase; color:var(--muted); text-align:left; padding:.85cqh 1cqw; font-weight:600}
  .stbl td{padding:.95cqh 1cqw; border-top:1px solid var(--hair); vertical-align:middle}
  .stbl td.cc{font-family:var(--mono); color:var(--ink); font-weight:600; white-space:nowrap}
  .stbl td.cc .nm{display:block; color:var(--muted); font-weight:400; font-size:.8em; white-space:normal}
  .stbl td.cap{font-family:var(--mono); color:var(--body); font-variant-numeric:tabular-nums; white-space:nowrap; text-align:center}
  .stbl td.miss{background:var(--amber-soft); box-shadow:inset 0 0 0 1.5px var(--amber); color:var(--amber); font-weight:700; text-align:center}
  .stbl td.miss small{display:block; font-family:var(--mono); font-size:.7em; font-weight:600; letter-spacing:.04em; text-transform:uppercase; margin-top:.25cqh}
  .fills{list-style:none; margin:1.1cqh 0 0; padding:0; display:flex; flex-direction:column; gap:1cqh}
  .fills li{font-size:1.9cqh; color:var(--body)}
  .fills .cc{font-family:var(--mono); color:var(--accent); font-weight:600}
  .fills .cc.h{color:var(--amber)}
  /* baseline-as-namespace concept */
  .nsdiag{margin-top:1.4cqh; display:flex; flex-direction:column; gap:1.2cqh}
  .ns-specs{display:grid; grid-template-columns:repeat(3,1fr); gap:1.4cqw}
  .ns-spec{border:1px solid var(--hair); border-radius:9px; background:var(--surface); padding:1.2cqh 1.1cqw; text-align:center}
  .ns-spec .st{font-family:var(--mono); font-size:1.35cqh; letter-spacing:.06em; text-transform:uppercase; color:var(--amber); font-weight:600}
  .ns-spec .sd{font-size:1.6cqh; color:var(--body); margin-top:.4cqh; line-height:1.22}
  .ns-rest{text-align:center; color:var(--muted); font-family:var(--mono); font-size:1.3cqh; letter-spacing:.05em}
  .ns-base{border:2px solid var(--accent); border-radius:12px; background:var(--accent-soft); padding:1.7cqh 2cqw; text-align:center}
  .ns-base .bt{font-size:2.5cqh; color:var(--ink); font-weight:720}
  .ns-base .bsub{font-size:1.7cqh; color:var(--body); margin-top:.5cqh; line-height:1.25}
  .ns-chips{display:flex; justify-content:center; gap:.8cqw; margin-top:1cqh; flex-wrap:wrap}
  .ns-chips .chip{background:var(--surface); margin:0}
  .ns-future{border:1px dashed var(--muted); border-radius:9px; padding:1.2cqh 1.5cqw; display:flex; align-items:center; gap:1.2cqw; color:var(--body); font-size:1.75cqh; line-height:1.25}
  .ns-future .ff{font-family:var(--mono); font-size:1.32cqh; letter-spacing:.05em; text-transform:uppercase; color:var(--amber); white-space:nowrap; font-weight:600}

  /* chrome */
  .rail{position:absolute; left:0; right:0; bottom:0; height:5px; display:flex}
  .rail i{flex:1} .rail .s1{background:var(--b-benign)} .rail .s2{background:var(--b-mid)} .rail .s3{background:var(--b-path)}
  .foot{position:absolute; left:8cqw; right:8cqw; bottom:3cqh; display:flex; align-items:center;
    justify-content:space-between; font-family:var(--mono); font-size:1.6cqh; color:var(--muted); letter-spacing:.05em}
  .foot .dl{text-transform:uppercase; letter-spacing:.14em}
  .foot .ct{font-variant-numeric:tabular-nums; color:var(--body)}
  .foot .ct b{color:var(--accent)}

  /* nav + notes controls (outside slide flow) */
  .ui{position:fixed; z-index:20; display:flex; gap:8px; right:16px; bottom:14px}
  .ui button{font-family:var(--mono); font-size:12px; letter-spacing:.04em; color:var(--body);
    background:var(--surface); border:1px solid var(--hair); border-radius:8px; padding:7px 10px; cursor:pointer}
  .ui button:hover{border-color:var(--accent); color:var(--accent)}
  .ui button:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
  .hint{position:fixed; left:16px; bottom:16px; z-index:20; font-family:var(--mono); font-size:11px;
    color:var(--muted); letter-spacing:.04em; opacity:.85}
  .hint b{color:var(--body)}

  #notes{position:fixed; z-index:30; left:0; right:0; bottom:0; transform:translateY(101%);
    transition:transform .3s cubic-bezier(.2,.7,.2,1); background:var(--surface);
    border-top:2px solid var(--accent); box-shadow:0 -20px 50px -30px #00000066; padding:18px 24px 22px;
    max-height:44dvh; overflow:auto}
  #notes.open{transform:none}
  #notes .nk{font-family:var(--mono); font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--accent); margin-bottom:6px}
  #notes .nb-t{color:var(--ink); font-weight:680; font-size:15px; margin-bottom:8px; font-family:var(--sans)}
  #notes p{margin:0; color:var(--body); font-size:14px; line-height:1.55; max-width:96ch; font-family:var(--sans)}
  @media (prefers-reduced-motion:reduce){ .slide{animation:none} #notes{transition:none} }

  .clickzone{position:fixed; top:0; bottom:0; width:22vw; z-index:10; cursor:pointer}
  .clickzone.left{left:0} .clickzone.right{right:0}
</style>

<div class="clickzone left" id="zprev" aria-label="Previous"></div>
<div class="clickzone right" id="znext" aria-label="Next"></div>

<div id="stage" role="group" aria-roledescription="slide" aria-label="SVCv4 presentation">
  <div class="slide" id="slide"></div>
  <div class="foot">
    <span class="dl">SVCv4 · Data Model</span>
    <span class="ct"><b id="cur">01</b> / <span id="tot">19</span></span>
  </div>
  <div class="rail" aria-hidden="true"><i class="s1"></i><i class="s2"></i><i class="s3"></i></div>
</div>

<div class="hint">◀ ▶ navigate · <b>S</b> speaker notes</div>
<div class="ui">
  <button id="bprev" aria-label="Previous slide">Prev</button>
  <button id="bnotes" aria-label="Toggle speaker notes">Notes</button>
  <button id="bnext" aria-label="Next slide">Next</button>
</div>

  const S_ALL = [
    { k:"Part 2 · the data model — under the hood", layout:"hero",
      title:"From the framework to the record — code by code",
      sub:"You have been introduced to the framework and standards. Now: how the data model makes them <b>computable and shareable</b> — and what you can build against today.<br><span style='color:var(--accent);font-family:var(--mono);font-size:.82em'>Follow along → clingen-data-model.github.io/svcv4-model</span>",
      by:"<b>SVCv4 Standards data-modeling team</b> · a ClinGen Data Platform WG effort",
      hero:true,
      notes:"One promise: by the end you'll know how a v4 classification is made, how it's structured so it can be shared and verified, and what you can build against today. This is the data model and reference code — not the Standard itself and not the scoring authority." },

    { k:"Why now", skip:true, title:"Standardize the structure early — before the tools proliferate",
      body:`<ul class="points">
        <li>Today a shared classification rarely shows <em>how</em> it was reached — a few PMIDs and a description, and you're left to try to understand the true reasoning.</li>
        <li>SVCv4 is far more <strong>granular</strong> about how each assessment is made — but only if the evidence is captured in a common structure.</li>
        <li>As shared classifications grow into the millions, <strong>evidence visibility</strong> becomes essential to reuse results at scale.</li>
        <li><strong>Define the shared structure now</strong> — before the tools proliferate — so each one <strong>applies the spec the same way</strong> and <strong>ships the evidence with the result</strong>, not just the final call.</li>
      </ul>`,
      notes:"The status quo is opaque — no consistent, community-wide way to see which assessments were met or not, or how the evidence was applied. Earlier-generation tools brought real benefit, but the evidence support behind them was never fully realized: the ClinGen Evidence Repository modeled structured evidence but stayed largely with expert panels, ClinVar had no support for structured codes, and submitters had little incentive to take on the extra burden of sharing them. SVCv4 is more granular — but only pays off if the structure exists and everyone uses it. As shared classifications grow into the millions, visibility into evidence and assessments is what lets others reuse shared data for better care and faster discovery. So we standardize early. (Principled framing — no old criteria codes.)" },

    { k:"How it happens today", title:"A curator classifies a variant — by hand, from disparate sources",
      body:`<ol class="steps">
        <li><strong>Set the context</strong> — the disease/condition, mode of inheritance, and canonical transcript — refined as evidence comes in.</li>
        <li><strong>Gather evidence</strong> from knowledge sources — gnomAD (population frequency), ClinVar (prior classifications), VEP (predicted consequence), GenCC (gene–disease validity), and PubMed to retrieve the primary literature.</li>
        <li><strong>Curate case-level data</strong> — judging which cases are <em>relevant</em> to each assessment.</li>
        <li><strong>Assess the evidence</strong> — apply the assessments to all observational, predictive, and functional data.</li>
      </ol>
      <p class="lead" style="margin-top:2.6cqh;font-size:2.32cqh;color:var(--muted)">No structured case registries exist — it's search, read, and hand-curate from papers (open + paywalled), plus deidentified clinical cases where a site has them.</p>`,
      notes:"Lead here to hook builders: classification is a real, manual, expert process before any model or score appears. Context is set up front and revised as evidence comes in. Much of the work is deciding relevance. And note the gap: reusable structured case data basically doesn't exist, so everyone re-reads. Curators also find interesting-but-out-of-scope data that's discarded today but could save others the effort — exactly what structure + sharing fixes." },

    { k:"Who owns what", skip:true, title:"Three groups, three jobs — meeting at the codes",
      body:`<table class="kv">
        <tr><td class="own">Framework</td><td class="who">ACMG / AMP / CAP / ClinGen SVCv4 WG</td><td class="what">The Summary Table, codes, workflows, and scoring approach.</td></tr>
        <tr class="mine"><td class="own">Data model</td><td class="who">This project · ClinGen Data Platform WG</td><td class="what">The <strong>shape</strong> of a classification — for interoperability.</td></tr>
        <tr><td class="own">Methods / rules</td><td class="who">A method/ruleset model — <em>not yet built</em> — + registries</td><td class="what">Evaluate the evidence and produce the scores.</td></tr>
      </table>
      <p class="lead" style="margin-top:2.4cqh;font-size:2.3cqh">They meet through <strong>codes</strong>: our record <em>names</em> a rule/version code; the method side <em>defines</em> it. <strong>ClinGen CSpec is one early implementer</strong> — not the standard, not the only tool.</p>`,
      notes:"Now that they've seen the real work, place the players. We don't author the Standard and don't own the rules. The methods side is itself a model that doesn't exist yet — how configuration and rulesets are structured so experts build specialized versions and register them. CSpec is one early implementer, not a de-facto standard. We model what a classification IS so it can link, by code, to whichever implementation produced it." },

    { k:"What a classification is", title:"Evidence that nests — the same shape at every level",
      body:`<div class="nest">
        <div class="nb"><div class="nl">Classification</div><div class="nt">A scored claim about a variant &amp; a condition — with a direction and a score.</div></div>
        <div class="nb n2"><div class="nl">Evidence line</div><div class="nt">Itself a small scored claim — backed by more lines, or by…</div></div>
        <div class="nb n3"><div class="nl">Captured facts</div><div class="nt">…the observations and data points underneath.</div></div>
      </div>
      <p class="lead" style="margin-top:2.4cqh;font-size:2.3cqh">Same shape at every level. That uniformity is what makes a classification computable and auditable.</p>`,
      notes:"The whole model is one recursive shape: a scored, directional claim, supported by smaller scored claims, down to the raw captured data. Every scored box in SVCv4 is one of these. The next slide names the pieces." },

    { k:"The pieces", title:"What holds a classification together",
      body:`<div class="dgram"><div class="jsonclip" onclick="svTP53()" title="Open the full record — draggable"><div class="jc-h"><span>TP53 · classification.json</span><span class="jc-x">⤢</span></div><pre class="jc-p">{
  "score": 5.0,
  "outcome": "Likely Pathogenic",
  "evidence": {
    "HOD": { … },
    "PFD": { "MIS": … }
  } …</pre></div>

          .dgram text{font-family:var(--sans)}
          .dgram .st{font-family:var(--mono);font-size:13px;fill:var(--accent);letter-spacing:.03em}
          .dgram .stb{fill:var(--b-benign)}.dgram .sta{fill:var(--amber)}.dgram .stm{fill:var(--muted)}
          .dgram .bt{font-size:21px;font-weight:700;fill:var(--ink)}
          .dgram .bt2{font-size:18px;font-weight:700;fill:var(--ink)}

          .dgram .bs2{font-family:var(--mono);font-size:12.5px;fill:var(--accent);font-style:italic}
          .dgram .el{font-family:var(--mono);font-size:12.5px;fill:var(--body);paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round}.jsonclip{position:absolute;top:5cqh;right:2cqw;width:19cqw;min-width:152px;background:var(--surface);border:1px solid var(--accent);border-radius:9px;box-shadow:var(--shadow);cursor:pointer;z-index:6;overflow:hidden}.jsonclip:hover{outline:2px solid var(--accent-soft)}.jsonclip .jc-h{font-family:var(--mono);font-size:1.25cqh;color:var(--ink);background:var(--accent-soft);padding:.5cqh .7cqw;display:flex;justify-content:space-between;gap:.6cqw;border-bottom:1px solid var(--hair)}.jsonclip .jc-x{color:var(--accent)}.jsonclip .jc-p{margin:0;padding:.55cqh .7cqw;font-family:var(--mono);font-size:1.15cqh;line-height:1.45;color:var(--muted);white-space:pre}
        </style>
        <svg viewBox="0 0 1040 560" preserveAspectRatio="xMidYMid meet" role="img" aria-label="A Statement asserts a Proposition, names a Method, records Contributions, and is backed by evidence lines that are themselves Statements.">

          <path class="ed" d="M520,120 V234" marker-end="url(#ah)"/>
          <text class="el" x="520" y="181" text-anchor="middle">hasEvidenceLines</text>
          <path class="ed" d="M520,346 V430" marker-end="url(#ah)"/>
          <text class="el" x="520" y="392" text-anchor="middle">hasEvidenceItems</text>
          <path class="ed" d="M392,118 C322,160 286,196 250,234" marker-end="url(#ah)"/>
          <text class="el" x="300" y="176" text-anchor="middle">subject · predicate · object</text>
          <path class="ed" d="M680,80 C716,104 728,128 744,166" marker-end="url(#ah)"/>

          <path class="ed" d="M680,104 C728,180 734,250 744,306" marker-end="url(#ah)"/>

          <g class="stmt"><rect class="box" x="360" y="20" width="320" height="100" rx="14"/>
            <text class="st" x="520" y="45" text-anchor="middle">«Classification»</text>
            <text class="bt" x="520" y="75" text-anchor="middle">Statement</text>
            <text class="bs" x="520" y="101" text-anchor="middle">direction · strength · score · outcome</text></g>
          <g class="prop"><rect class="box" x="44" y="234" width="292" height="146" rx="13"/>
            <text class="st stb" x="190" y="260" text-anchor="middle">the claim</text>
            <text class="bt" x="190" y="288" text-anchor="middle">Proposition</text>
            <text class="bs" x="190" y="316" text-anchor="middle">Subject — the variant (VBC)</text>

            <text class="st stm" x="884" y="312" text-anchor="middle">contributions</text>
            <text class="bt2" x="884" y="338" text-anchor="middle">Contribution + Agent</text>
            <text class="bs" x="884" y="362" text-anchor="middle">who · what · when</text></g>
          <g class="stmt"><rect class="box" x="360" y="234" width="320" height="112" rx="14"/>
            <text class="st" x="520" y="260" text-anchor="middle">«Statement»</text>
            <text class="bt" x="520" y="290" text-anchor="middle">Evidence line</text>
            <text class="bs" x="520" y="314" text-anchor="middle">direction · score · outcome</text>

        </svg>
        <p class="lead" style="margin-top:1.4cqh;font-size:2.15cqh">Six entities, one shape: the <strong>Statement</strong> asserts a <strong>Proposition</strong>, names its <strong>Method</strong>, records its <strong>Contributions</strong>, and is held up by <strong>evidence lines</strong> — each itself a Statement, all the way down.</p>
      </div>`,
      notes:"These four come from GA4GH VA-Spec and recur all talk. A Statement asserts a Proposition; it's held up by Evidence (and an evidence line is itself a Statement, so evidence and claim share one shape). Two more make it trustworthy: the Method (which ruleset — the pointer that carries version identity) and Contributions by Agents (who curated, reviewed, approved, when). A classification is a claim, its evidence, the method, and the people/agents who made it." },

    { k:"Standards & sharing", skip:true, title:"Build on GA4GH — and a SVCv4 profile that validates",
      body:`<ul class="points">
        <li>We <strong>build on</strong> GA4GH's shared, computer-readable shape for variant knowledge — we don't invent a serialization.</li>
        <li>A <strong>SVCv4 profile</strong> adds SVCv4-specific constraints, so a record can be <strong>validated for conformance</strong> — provably a well-formed SVCv4 result, not just plausible.</li>
        <li>Common standards → <strong>open data sharing</strong>: validate once and anywhere, exchange without re-negotiating formats, aggregate across labs, <strong>reuse evidence</strong>, build tooling once.</li>
      </ul>`,
      notes:"Two moves: we constrain GA4GH's shared shape rather than invent one; and the profile is a validation contract — any tool can check a record before trusting or ingesting it. That's the difference between 'looks right' and 'provably conformant.' The general payoff: open data sharing stops being a series of one-off format negotiations, and — the theme of the next two slides — you reuse the evidence instead of re-curating it." },

    { k:"Principle 1", skip:true, title:"A record you can inspect — not a label you must trust",
      body:`<ul class="points">
        <li>A v4 classification carries the <strong>evidence and assessments</strong> that produced it — not just the verdict. "Show your work" is built in.</li>
        <li>Captured facts live <strong>under the line that scored them</strong>; when the record is shared, the reasoning travels with it.</li>
        <li>One <strong>shared, validatable shape</strong> → a lab's record and a knowledgebase's record process with the same tooling.</li>
        <li>A <strong>ClinVar-style consumer</strong> gets the <em>reasoning</em> — and can re-derive, compare, or challenge the call.</li>
      </ul>`,
      notes:"The interoperability payoff and the developer's plug-in point. Honest on ClinVar: it's the flagship example of a consuming knowledgebase, not a shipped integration — today it appears as a variant-id namespace and a source of external evidence. Say 'the kind of knowledgebase that would consume these records.'" },

    { k:"Principle 1 · applied", title:"Applied evidence — bound to a precise rule",
      body:`<ul class="points amber">
        <li>Curated evidence becomes <strong>applied evidence items</strong> when attached to a <strong>specific rule or method</strong> — the exact assessment it contributes to.</li>
        <li>Applied evidence = the <strong>minimal data points</strong> that rule needs <strong>+ enough provenance</strong> to know where they came from.</li>
        <li>Because it's unambiguous, the rule can be assessed <strong>manually or computationally</strong> — no guesswork.</li>
        <li>This is the <strong>best data to share</strong>: others see exactly how the outcome was reached.</li>
      </ul>`,
      notes:"Distinguish collected evidence (a paper, a cohort, a prediction) from applied evidence — specific data points, pinned to the specific rule they satisfy, with provenance. A rule asks a precise question; applied evidence is the minimal, provenanced answer. No ambiguity in how the rule was satisfied — human or machine assesses it the same way. And it's exactly what to publish in the result. This is what makes 'show your work' verifiable rather than narrative." },

    { k:"Principle 1 · granularity", title:"Granularity decides whether results are verifiable",
      body:`<div class="split">
        <div class="col bad"><div class="h">Coarse</div><p>"Identified in multiple cardiomyopathy patients referred for genetic testing and in the literature (PMID: 25611685, 27532257, 33673806, 33663232, 37652022)." → realistic, but the evidence stays <strong>buried in prose</strong>: to verify or reuse it, the next curator must <strong>re-curate from scratch</strong>.</p></div>
        <div class="col good"><div class="h">Granular</div><style>.gcase{font-family:var(--mono);font-size:1.8cqh;line-height:1.5;margin:.2cqh 0 1cqh;border-left:2px solid var(--accent);padding-left:1.3cqw}.gcase .grow{display:flex;gap:1cqw;padding:.18cqh 0}.gcase .gk{color:var(--muted);min-width:7cqw}.gcase .gv{color:var(--body)}.gcase .sc{margin-top:.35cqh;border-top:1px solid var(--hair);padding-top:.5cqh}.gcase .sc .gv{color:var(--accent);font-weight:600}</style><div class="gcase"><div class="grow"><span class="gk">case</span><span class="gv">1 affected proband · cardiomyopathy</span></div><div class="grow"><span class="gk">source</span><span class="gv">PMID:25611685</span></div><div class="grow"><span class="gk">method</span><span class="gv"><span class="cc">CLN_AFF</span> affected observation</span></div><div class="grow sc"><span class="gk">→ score</span><span class="gv">+1.0 · supports</span></div></div><p>The same patient, applied as one data point → rule → score: <strong>computationally verifiable</strong> and <strong>reusable</strong> — no re-curation.</p></div>
      </div>
      <p class="lead" style="margin-top:2.4cqh;font-size:2.34cqh">The goal — <strong>verifiable results</strong> — depends on <em>how precisely</em> evidence is applied and shared.</p>`,
      notes:"The argument for the whole design. Coarse citation means anyone verifying re-reads and re-derives — expensive, manual, not reusable. Granular applied evidence lets a machine check the result and the next curator reuse the applied data points. Granularity is the lever between 'trust me, I read the papers' and 'here is the checkable, reusable chain' — the manual-today vs computational-tomorrow contrast." },

    { k:"Terminology · the official codes", tsize:"5.0cqh", top:true,
      title:"“Codes” are three levels on the Summary Table",
      body:`<style>.tiers .te{margin-top:1cqh;display:flex;align-items:baseline;gap:.7cqw}.tiers .te .cc{font-size:3.1cqh;font-weight:800;letter-spacing:.01em}.tiers .cc.prov{color:var(--amber)}.tiers .provtag{font-family:var(--mono);font-size:1.35cqh;color:var(--amber);text-transform:uppercase;letter-spacing:.1em;font-weight:700}</style><div class="tiers">
        <div class="tier"><div class="tl">Evidence Category</div><div class="tn">Predictive &amp; Functional Data</div><div class="te"><span class="cc prov">PFD</span><span class="provtag">provisional</span></div></div>
        <span class="tarrow">→</span>
        <div class="tier"><div class="tl">Evidence Concept</div><div class="tn">Missense Change</div><div class="te"><span class="cc">MIS</span></div></div>
        <span class="tarrow">→</span>
        <div class="tier"><div class="tl">Evidence Code</div><div class="tn">Prediction for single AA change</div><div class="te"><span class="cc">MIS_PRD</span></div></div>
      </div>
      <p class="lead" style="margin-top:2.8cqh;font-size:2.15cqh">All three are <em>official SVCv4</em> codes — and we call them all “codes.” Mind the ambiguity: <strong>Category, Concept, and Code are distinct levels.</strong></p>`,
      notes:"The Summary Table organizes official codes top-down: Evidence Category to Evidence Concept to Evidence Code. Because we call all three levels 'codes', be explicit about which level you mean. The Evidence Code (e.g. MIS) is the jumping-off point for a workflow." },

    { k:"On the Summary Table · every combination", tsize:"4.3cqh", top:true,
      title:"Every combination cap on the table — no code",
      body:`<table class="stbl" style="font-size:1.7cqh"><caption>Predictive &amp; Functional Data — the “Evidence Combination Cap” cells</caption>
        <tr><th>Concept</th><th>Combines</th><th>Combination cap</th><th>Provisional code</th></tr>
        <tr><td class="cc">MIS</td><td class="cap" style="text-align:left">MIS_PRD + MIS_FXN</td><td class="cap miss">−8 … +6</td><td class="cc" style="color:var(--amber)">MIS_PRD_FXN</td></tr>
        <tr><td class="cc">CDS</td><td class="cap" style="text-align:left">CDS_PRD + CDS_FXN</td><td class="cap miss">−8 … +9</td><td class="cc" style="color:var(--amber)">CDS_PRD_FXN</td></tr>
        <tr><td class="cc">NUL</td><td class="cap" style="text-align:left">NUL_PRD + NUL_FXN</td><td class="cap miss">−8 … +10</td><td class="cc" style="color:var(--amber)">NUL_PRD_FXN</td></tr>
        <tr><td class="cc">SPL</td><td class="cap" style="text-align:left">SPL_PRD + SPL_SPA</td><td class="cap miss">−6 … +6</td><td class="cc" style="color:var(--amber)">SPL_PRD_SPA</td></tr>
        <tr><td class="cc">SPL</td><td class="cap" style="text-align:left">( SPL_PRD_SPA ) + SPL_FXN</td><td class="cap miss">−8 … +9</td><td class="cc" style="color:var(--amber)">SPL_PRD_SPA_FXN</td></tr>
        <tr><td colspan="4" style="text-align:left;color:var(--muted);font-size:1.45cqh;padding-top:1.1cqh;text-transform:uppercase;letter-spacing:.07em">Category roll-ups — no code either</td></tr>
        <tr><td class="cc">HOD</td><td class="cap" style="text-align:left">POP + CLN + LOC</td><td class="cap miss">summed</td><td class="cc" style="color:var(--amber)">HOD</td></tr>
        <tr><td class="cc">PFD</td><td class="cap" style="text-align:left">MIS / NUL / CDS / SPL</td><td class="cap miss">selected</td><td class="cc" style="color:var(--amber)">PFD</td></tr>
      </table>
      <p class="lead" style="margin-top:2.4cqh;font-size:1.9cqh">Each “Evidence Combination Cap” cell has a cap but <strong>no code</strong> (SM 8: “no distinct code for the combination”). We mint <span class="tag prov">provisional codes</span> to fill them — so a shared record can name every rolled-up assessment.</p>`,
      notes:"The Summary Table's 'Evidence Combination Cap' column defines a cap for each rolled-up combination but assigns it no code (SM 8: there is no distinct code for the combination). Across PFD: MIS_PRD+MIS_FXN (−8..+6), CDS (−8..+9), NUL (−8..+10), and splice twice — SPL_PRD+SPL_SPA (−6..+6) then +SPL_FXN (−8..+9). We mint provisional codes (MIS_PRD_FXN, CDS_PRD_FXN, NUL_PRD_FXN, SPL_PRD_SPA, SPL_PRD_SPA_FXN) so a shared record can name each. Provisional pending WG ratification." },

    { k:"One hierarchy, two views", tsize:"4.6cqh", top:true,
      title:"The code hierarchy is the evidence-line hierarchy",
      body:`<div class="maptwo">
        <div class="mapcol"><h4>Method / ruleset codes</h4><div class="tree small" style="font-size:1.52cqh"><span class="lvl0">MIS</span> <span class="tag off">official</span>
├─ <span class="held">MIS_PRD_FXN</span> <span class="tag prov">prov code</span>
│   ├─ <span class="code">MIS_PRD</span> <span class="tag off">official</span>
│   │   ├─ <span class="held">MIS_PRD_INIT_*</span> <span class="tag prov">prov sub</span>
│   │   └─ <span class="held">MIS_PRD_EXON_*</span> <span class="tag prov">prov sub</span>
│   └─ <span class="code">MIS_FXN</span> <span class="tag off">official</span>
└─ <span class="code">MIS_INF</span> <span class="tag off">official</span></div></div>
        <div class="mapmid">≡</div>
        <div class="mapcol"><h4>Evidence lines in the record</h4><div class="tree small" style="font-size:1.52cqh"><span class="lvl0">line · MIS</span>
├─ line · <span class="held">MIS_PRD_FXN</span>
│   ├─ line · <span class="code">MIS_PRD</span>
│   │   ├─ line · <span class="held">MIS_PRD_INIT_*</span>
│   │   └─ line · <span class="held">MIS_PRD_EXON_*</span>
│   └─ line · <span class="code">MIS_FXN</span>
└─ line · <span class="code">MIS_INF</span></div></div>
      </div>
      <p class="lead" style="margin-top:2.0cqh;font-size:1.9cqh">Every code becomes a matching <strong>evidence line</strong> — official, a <span class="held">provisional code</span>, or a <span class="held">provisional subcode</span>. Each node already exists; the provisional ones just give the currently-unnamed nodes a name.</p>`,
      notes:"The code/method hierarchy maps one-to-one onto the evidence-line hierarchy in the record: each node — subcode, official code, or the concept total — is a nested evidence line carrying its score. Two things carry over from the previous slides: the missing combination-cap code (MIS_PRD+FXN) still appears as a HELD, codeless evidence line in the record, and the subcodes (initial points, exon relevance) appear as leaf lines. The record already has the node; it just lacks a code — which is the argument for adding one. Reading a record, you climb the same tree from leaf to concept total." },

    { k:"Worked · MIS_PRD (TNNI3)", tsize:"4.6cqh", top:true,
      title:"From the workflow to two backed evidence lines",
      body:`<div class="demo">
        <div><img src="${SM6}" alt="SM 6 Figure 2 — MIS_PRD initial points and exon relevance">
          <div class="cap">SM 6 Fig 2 — initial in-silico points, then exon relevance if positive.</div></div>
        <div>
          <div class="leaf"><div class="lh">MIS_PRD_INIT_REVEL_* · initial points <span class="tag prov" style="font-size:.75em">provisional subcode</span></div><div class="lb">predictor score → points</div>
            <span class="chip"><b>tool</b> REVEL</span><span class="chip"><b>score</b> 0.577</span><span class="chip">→ <b>+1.0</b></span></div>
          <div class="leaf amber"><div class="lh">MIS_PRD_EXON_ALL · exon relevance <span class="tag prov" style="font-size:.8em">provisional subcode</span></div><div class="lb">VBC exon in clinically-relevant transcripts</div>
            <span class="chip"><b>All</b> transcripts</span><span class="chip">→ <b>×100%</b></span></div>
          <div class="result"><b>MIS_PRD = +1.0</b>&nbsp;&nbsp;( +1.0 × 100% ) — MIS_PRD is official; its two leaf codes are provisional</div>
        </div>
      </div>`,
      notes:"Grounded in the TNNI3 practice variant (v18-tnni3): its EvidenceItem carries tool=REVEL, score=0.577, which maps through SM 6 Figure 2 to +1.0 initial points; the VBC exon is present in all clinically-relevant transcripts, so exon relevance is x100 percent. MIS_PRD = +1.0. Two leaf evidence lines, each backed by its own data points — the predictor tool and score for one, the exon assessment for the other. This is applied evidence at the leaf, which makes the assessment verifiable and reusable." },

    { k:"Worked · the MIS roll-up (SM 6 Fig 4)", tsize:"4.4cqh", top:true,
      title:"Fig 4 is the climb: prior sum → MIS_INF → code as MIS_",
      body:`<div class="demo">
        <div><img src="${SM6_4}" alt="SM 6 Figure 4 — informative variants (MIS_INF) and the MIS_ roll-up">
          <div class="cap">SM 6 Fig 4 — MIS_INF, then “add prior sum … cap and code as MIS_ −8…+9”.</div></div>
        <div>
          <div class="tree small" style="font-size:1.62cqh"><span class="code">MIS_PRD</span>  +1.0         <span class="tag off">official</span>
<span class="code">MIS_FXN</span>  —            <span class="tag off">official</span>
<span class="held">MIS_PRD_FXN</span>  = prior sum   <span class="tag prov">provisional code</span>
<span class="code">MIS_INF</span>  informative   <span class="tag off">official</span>
──────────────────────────
<span class="lvl0">MIS_</span>  cap −8 … +9               <span class="tag off">official code</span></div>
          <div class="result" style="margin-top:1.4cqh">Fig 4’s <em>“add prior sum … code as MIS_”</em> <strong>is</strong> the roll-up. The “prior sum” is <span class="held">MIS_PRD_FXN</span> <span class="tag prov" style="font-size:.85em">provisional code</span>. Our model makes this climb an explicit, shareable record.</div>
        </div>
      </div>`,
      notes:"SM 6 Figure 4 — a figure the audience already knows — is the informative-variants flow (MIS_INF), and it ends by 'adding the prior sum to MIS_INF and capping and coding as MIS_'. That prior sum is the held MIS_PRD+FXN combination — the missing code from the last slides. So the familiar figure IS the climb up the code hierarchy: MIS_PRD and MIS_FXN held under MIS_PRD+FXN, plus MIS_INF, capped into the MIS_ concept total. Our model just makes that climb an explicit, nested, shareable record — with a code at every node. (MIS_PRD +1.0 is the grounded TNNI3 value; MIS_INF is the informative slot.)" },

    { k:"Why the codes matter", tsize:"4.4cqh", top:true,
      title:"Each code is the method — so you can show the work at any depth",
      body:`<div class="tree small" style="font-size:1.82cqh">line · method = <span class="code">MIS</span>                     → concept total
└─ line · method = <span class="code">MIS_PRD</span>              → +1.0
   ├─ line · method = <span class="held">MIS_PRD_INIT_REVEL_*</span>  → +1.0   ← the actual method, at the leaf
   └─ line · method = <span class="held">MIS_PRD_EXON_ALL</span>      → ×100%</div>
      <p class="lead" style="margin-top:2.2cqh;font-size:2.0cqh">Every code — official, a <span class="held">provisional code</span>, or a <span class="held">provisional subcode</span> — is the <strong>method</strong> on its evidence line: the rule that produced that assessment. Codes carry the concept prefix (<span class="code">MIS_</span>) so a specialization can diverge one flow's rule from another's; rules that share inputs, results, and change together may be generic — <strong>the WG finalizes which.</strong> Either way, the record can <strong>show the work as deep as you want.</strong></p>
      <div class="result" style="margin-top:1.8cqh;font-size:2.0cqh">The data-modeling goal: <strong>faithfully represent the framework's rules as defined.</strong> A big ask — and the shared goal that makes every result verifiable.</div>`,
      notes:"This is the synthesizing point of the whole codes section. In the record, every evidence line names a method — and that method IS the code. So the official codes and the provisional codes and subcodes we mint (MIS_PRD_FXN, MIS_PRD_INIT_REVEL_*, MIS_PRD_EXON_ALL…) are the actual methods used at the lower-level assessments. Nomenclature point: a per-flow subcode carries its concept prefix (MIS_) so a specialization can make one flow's rule differ from another's — e.g. the in-silico initial-points table could diverge between MIS and other variant-impact flows; a rule that takes the same inputs, gives the same results, and would change together across flows may instead be coded generically. Which codes are scoped (prefixed by their concept, e.g. MIS_) versus generic is a decision for the SVCv4 committee to finalize. Because we can define a code at any depth — versioning it when a rule is modified, minting it per the nomenclature when a rule is added — the record can show the work all the way down to the predictor call and the exon call at the leaf. The data-modeling approach is to represent the framework's rules exactly as defined, as named methods at every level. It's a big ask — faithfully modeling all the rules — but it's the shared goal, and it's what makes classifications verifiable and reusable rather than opaque. Frame this as the invitation to collaborate." },

    { k:"Principle 2", skip:true, title:"One baseline, tuned — not forked",
      body:`<ul class="points">
        <li>SVCv4 ships <strong>one baseline</strong> set of workflows — same steps, weights, thresholds for every gene.</li>
        <li>It's built to be <strong>tuned, not rewritten</strong>: expert panels change the <strong>configuration behind decision points</strong>, never the workflow structure.</li>
        <li>The <strong>record keeps the same shape</strong> either way; only the <em>rule behind a named code</em> changes.</li>
        <li><strong>Within limits:</strong> a specialization can tune only so far and still be <strong>SVCv4-compliant</strong> — "specialized" ≠ "a different standard."</li>
      </ul>`,
      notes:"SVCv4 is designed to be tuned, not rewritten. Everyone starts from the same baseline and data shape; a panel encodes disease-specific knowledge by adjusting configuration at decision points, and neither the workflow nor the record shape changes. Build one pipeline, it works for baseline or specialization — only the rule a code resolves to differs. And there are reasonable limits to how far you can tune and still claim SVCv4 — that boundary keeps the ecosystem coherent." },

    { k:"Principle 2 · the dials", skip:true, title:"Three dials a specialization can turn",
      body:`<div class="grid2">
        <div class="cell"><div class="ct">Re-weight points</div><div class="cd">How much a predicted loss-of-function counts, given the gene's mechanism and which exons matter.</div></div>
        <div class="cell"><div class="ct">Add / limit tools</div><div class="cd">Mandate a gene-calibrated in-silico predictor; add an in-house one; down-weight or disallow one that misbehaves.</div></div>
        <div class="cell"><div class="ct">Refine the spectrums</div><div class="cd">Move a threshold edge — <em>and subdivide a category</em> into finer levels (<span class="code">SPECIFIC</span>&thinsp;/&thinsp;<span class="code">CONSISTENT</span> → more/less specific, more/less consistent).</div></div>
        <div class="cell amber"><div class="ct">Unchanged</div><div class="cd"><b>Same workflow, same codes, same record</b> — only the numbers, tool lists, and category granularity behind a step.</div></div>
      </div>`,
      notes:"One real example per dial. Weights: the baseline scales predicted-impact points by mechanism and exon relevance; a panel can override per gene. Tools: the missense workflow lists several calibrated predictors and makes you pick one; a panel can require a gene-tuned one or down-weight an over-caller. Spectrums: a panel can move a threshold edge AND add more granular categories to a baseline's qualified spectrum — e.g. splitting phenotype specificity's SPECIFIC / CONSISTENT into more/less specific and more/less consistent. In every case the decision point, code, and record shape are untouched." },

    { k:"Principle 3 · the baseline is the namespace", tsize:"4.3cqh", top:true,
      title:"SVCv4 is the namespace — one foundation for every code",
      body:`<div class="nsdiag">
        <div class="ns-specs">
          <div class="ns-spec"><div class="st">Specialization</div><div class="sd">reuses baseline codes, adds its own</div></div>
          <div class="ns-spec"><div class="st">Specialization</div><div class="sd">tunes rules for a gene / disease — still compliant</div></div>
          <div class="ns-spec"><div class="st">Specialization</div><div class="sd">…</div></div>
        </div>
        <div class="ns-rest">▲ built on, and compliant with, the baseline</div>
        <div class="ns-base"><div class="bt">SVCv4 baseline framework &amp; spec — the namespace</div><div class="bsub">codes &amp; subcodes defined once, so every computational tool relies on the same vocabulary</div>
          <div class="ns-chips"><span class="chip">codes</span><span class="chip">subcodes</span><span class="chip">methods</span></div></div>
        <div class="ns-future"><span class="ff">open · for the SVCv4 committee</span> As the framework changes, plan how codes &amp; subcodes are <strong>versioned for reuse</strong> — not re-minted on every baseline update.</div>
      </div>`,
      notes:"The concept, not the syntax. The SVCv4 baseline framework and spec act as a namespace — the shared starting point where codes and subcodes are defined, so every computational implementer can rely on the same vocabulary. Specializations build compliant versions on that baseline: they reuse the baseline's codes where a rule is unchanged and add their own where they tune it, while staying SVCv4-compliant. The open question for the SVCv4 committee: how future changes to the framework roll out — the impact on codes and subcodes, and whether to version them so they can be reused rather than minting brand-new codes each time the baseline updates. (Deliberately no invented namespace or version names here — those are the committee's to decide.)" },

    { k:"Principle 3 · why it matters", title:"Comparable, reproducible, auditable",
      body:`<ul class="points">
        <li><strong>Comparable</strong> — two scores match in meaning only when they cite the same rule ids.</li>
        <li><strong>Reproducible</strong> — re-resolve the named versions and rules, recompute.</li>
        <li><strong>Auditable</strong> — the record shows the exact rule id behind each piece of evidence.</li>
        <li>Versions move <strong>independently</strong>; when the baseline changes, specializations revise and re-register against it.</li>
        <li><em>Honest status:</em> the fields exist today; stamping isn't yet mandatory and the method/ruleset model + registry are still to be built.</li>
      </ul>`,
      notes:"The payoff for a producer/consumer. Stress independence and the cascade: a specialization can be corrected on its own schedule; when the committee changes the baseline, every specialization revises and re-registers, so a consumer is never guessing which baseline a specialization sat on. Be straight about current state: slots are in the model, but version-stamping is optional, the code scheme isn't finalized, and the method/ruleset model itself isn't built yet." },

    { k:"The computing layer", title:"A reference scorer — non-authoritative by construction",
      body:`<ul class="points">
        <li>A <strong>reference scorer</strong> in the repo mirrors the documented point rules — for tests, worked examples, and the practice set.</li>
        <li>It proves the captured <em>and applied</em> evidence is <strong>sufficient to compute</strong> a result with no ambiguity.</li>
        <li><strong>We are not the authority</strong> — every result is non-authoritative; the registered ruleset implementation governs. It's a handy oracle to diff against.</li>
      </ul>`,
      notes:"We're not the scorer of record. We wrote a mirror of the documented rules to prove — mechanically — that the model captures everything a scorer needs, and that granular applied evidence is enough to compute a result without ambiguity. First layer in the repo that computes anything, and an oracle to diff your own scorer against. Don't call CSpec 'the authority' — it's one early implementer." },

    { k:"See it end to end", title:"One variant — from captured facts to a banded call",
      body:`<ul class="points">
        <li>A practice-set variant, worked through: <strong>captured facts → applied to codes → scored lines of evidence → combined total → band</strong>.</li>
        <li>Each line shows its <strong>code, direction, and score</strong>; the audit trail shows how one code was reached.</li>
        <li>The same nested, applied structure is <strong>exactly what another system consumes</strong>.</li>
      </ul>
      <div class="spectrum"><i class="s1"></i><i class="s1"></i><i class="s2"></i><i class="s3"></i><i class="s3"></i></div>
      <div class="spectrum-lab"><span>Benign</span><span>Uncertain</span><span>Pathogenic</span></div>`,
      notes:"The anchor. Pick one clean example from the 32 CI-validated practice variants. Show captured fields, then the applied evidence and the scored lines it produces — each with code, direction, score — then the roll-up and band. Emphasize code = identity, score = outcome, shown separately (CLN_AFF, score +1.0). This is where the whole talk becomes concrete. Pair with a workflow explainer graphic if one exists." },

    { k:"For developers", title:"What you'll be able to build against — when the draft is ready",
      body:`<ul class="points">
        <li><strong>JSON Schemas</strong> for every entity — generated from the model, CI-enforced.</li>
        <li>Two record shapes: the <strong>inputs</strong> you submit and the <strong>rolled-up classification</strong> that comes back.</li>
        <li><strong>32 validated worked examples</strong> — real curated pilot variants, traceable to source.</li>
        <li>A <strong>reference scorer</strong> is <strong>being considered</strong> — a non-authoritative oracle for your implementation's expected points.</li>
      </ul>
      <p class="lead" style="margin-top:2.2cqh;font-size:2.1cqh;color:var(--muted)">The Standard isn't finalized — shapes are stable enough to build against; illustrative scores aren't spec-locked.<br><span style="color:var(--accent);font-family:var(--mono)">Explore the model, workflows &amp; worked examples → clingen-data-model.github.io/svcv4-model</span></p>`,
      notes:"You don't wait for the guideline to start — the contract is JSON Schema generated from the model, CI-enforced. Two shapes: the case record you submit and the rolled-up classification that comes back. Test against 32 real curated pilot variants, not synthetic stubs." },

    { k:"Takeaways", skip:true, title:"Four things to remember",
      body:`<ol class="take">
        <li>A v4 classification is a <strong>computable record, not just a verdict</strong> — the call plus the evidence behind it.</li>
        <li>Standardizing early lets tool-builders <strong>assess consistently to the spec</strong> and <strong>share results with their evidence</strong>.</li>
        <li><strong>Granular applied evidence</strong> makes results verifiable and reusable — and scales as submissions grow.</li>
        <li>Every result <strong>carries the identity of the ruleset</strong> — baseline or specialized — that produced it.</li>
      </ol>
      <p class="capstone">The Standard defines the framework; a method/ruleset layer (yet to be built) defines the methods; <strong>we define the shape</strong> — so SVCv4 classifications and their evidence are computable, shareable, and verifiable.</p>`,
      notes:"The four things to leave with — recap each in a sentence, tying back to the worked example. Then the one-liner as the capstone. Invite engagement: repo, docs, feedback." },

    { k:"See it live", tsize:"4.6cqh", top:true,
      title:"The docs — your on-ramp to the codes & workflows",
      body:`<ul class="points">
        <li>The reformatted docs walk the <strong>“Collecting the evidence”</strong> arc: curation activities → population → the Case model → variant impact.</li>
        <li>Every <strong>code and subcode</strong> documented — with the workflows, caps, and worked examples.</li>
        <li><strong>JSON Schemas + 32 validated examples</strong> to build against, and a reference scorer to check your points.</li>
      </ul>
      <div class="result" style="margin-top:1.8cqh;font-size:2.05cqh">▶ <strong>Live demo</strong> — clingen-data-model.github.io/svcv4-model</div>`,
      notes:"Switch to the live docs here. Walk the Collecting-the-evidence arc: (1) starting curation activities (VBC/MDE/gene/transcript, gnomAD, DAFT); (2) population (POP_FRQ the gate, POP_HMZ); (3) the Case model as the superset holding all CLN/LOC evidence; (4) variant impact (prediction/functional/splice/informative). Then show a worked-example page and the JSON schemas. The point: this is where a developer starts." },

    { k:"Get involved", layout:"closing", title:"Help make this standard practice",
      closing:true,
      credits:`<b>What we need:</b> feedback on the codes & subcodes · implementers who generate and consume v4 classifications · the SVCv4 committee’s calls on versioning & nomenclature — toward the ~2027 publication.<br><br><b>Contributors:</b> Alicia Byrne · Larry Babb · Christine Preston · Neethu Shah, with the wider SVCv4 data-modeling team.`,
      links:"Docs, workflows &amp; worked examples → clingen-data-model.github.io/svcv4-model  ·  Repo → github.com/clingen-data-model/svcv4-model",
      notes:"Keep 2 minutes. Pre-load: Is this the scorer of record? (No — the registered ruleset implementation is; ours is a reference oracle. CSpec is one early implementer.) How do specializations fit? (Same record shape; the code resolves to a different rule/version, within compliance limits.) Which version produced a result? (Named on the record; resolved via the forthcoming registry.) Can ClinVar consume this today? (Motivating use-case, not a shipped integration.)" }
  ];

  const S = S_ALL.filter(x => !x.skip);
  const el = document.getElementById('slide');
  const cur = document.getElementById('cur');
  const notes = document.getElementById('notes');
  document.getElementById('tot').textContent = String(S.length);
  let i = 0, notesOpen = false;

  function render(){
    const s = S[i];
    let inner = `<div class="kicker">${s.k}</div>`;
    if(s.hero){
      inner = `<div class="hero"><div class="kicker">${s.k}</div>`+
        `<h1 class="title">${s.title}</h1><p class="sub">${s.sub}</p>`+
        `<div class="spectrum"><i class="s1"></i><i class="s1"></i><i class="s2"></i><i class="s3"></i><i class="s3"></i></div>`+
        `<div class="spectrum-lab"><span>Benign</span><span>Uncertain significance</span><span>Pathogenic</span></div>`+
        `<div class="by">${s.by}</div></div>`;
    } else if(s.closing){
      inner = `<div class="closing"><div class="kicker">${s.k}</div>`+
        `<h1 class="title">${s.title}</h1><p class="credits">${s.credits}</p>`+
        `<div class="links">${s.links}</div></div>`;
    } else {
      const tstyle = s.tsize ? ` style="font-size:${s.tsize}"` : '';
      inner += `<h1 class="title"${tstyle}>${s.title}</h1><div class="content${s.top ? ' top' : ''}">${s.body}</div>`;
    }
    el.innerHTML = inner;
    el.style.animation = 'none'; void el.offsetWidth; el.style.animation = '';
    cur.textContent = String(i+1).padStart(2,'0');
    if(notesOpen) renderNotes();
  }
  function renderNotes(){
    const s = S[i];
    notes.innerHTML = `<div class="nk">Speaker notes · ${String(i+1).padStart(2,'0')}</div>`+
      `<div class="nb-t">${s.title.replace(/&amp;/g,'&')}</div><p>${s.notes||''}</p>`;
  }
  function go(n){ i = Math.max(0, Math.min(S.length-1, n)); render(); }
  function toggleNotes(){ notesOpen=!notesOpen; notes.classList.toggle('open',notesOpen); if(notesOpen) renderNotes(); }

  document.getElementById('bnext').onclick=()=>go(i+1);
  document.getElementById('bprev').onclick=()=>go(i-1);
  document.getElementById('znext').onclick=()=>go(i+1);
  document.getElementById('zprev').onclick=()=>go(i-1);
  document.getElementById('bnotes').onclick=toggleNotes;
  addEventListener('keydown',e=>{
    if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){e.preventDefault();go(i+1);}
    else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(i-1);}
    else if(e.key==='Home'){go(0);} else if(e.key==='End'){go(S.length-1);}
    else if(e.key==='s'||e.key==='S'){toggleNotes();}
  });
  render();
