site_name: SVCv4 Classification Model
site_description: GA4GH GKS VA-Spec community profile for the ACMG/AMP/CAP/ClinGen SVCv4 Standards
site_url: https://clingen-data-model.github.io/svcv4-model/
repo_url: https://github.com/clingen-data-model/svcv4-model
repo_name: clingen-data-model/svcv4-model
edit_uri: edit/main/docs/
strict: true

theme:
  name: material
  custom_dir: overrides
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow
    - content.code.copy
    - content.action.edit
    - content.action.view
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to light mode

extra_css:
  - assets/stylesheets/applicability.css

extra_javascript:
  - assets/javascripts/applicability.js

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            show_signature_annotations: true
            separate_signature: true
            members_order: source
            heading_level: 2
            merge_init_into_class: true
            show_bases: true
            docstring_section_style: table

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - tables
  - toc:
      permalink: true

nav:
  - Overview:
      - Home: index.md
      - Reviewing this site: overview/review-guide.md
      - SVCv4 Standards in brief: overview/svcv4-in-brief.md
      - How SVCv4 maps to the model: overview/alignment.md
      - What this project is — and isn't: overview/scope.md
  - Getting Started:
      - "Show your work: structured evidence": getting-started/show-your-work.md
      - The classification inputs: getting-started/classification-inputs.md
      - The assertion framework: getting-started/assertion-framework.md
      - Capturing basic evidence: getting-started/capturing-basic-evidence.md
      - Evidence Lines & Evidence Items: getting-started/evidence-lines-and-items.md
      - Rolling up Evidence Line scores: getting-started/rolling-up-scores.md
